<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Autonomous — Senior Distributed Systems Engineer Application</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --focus-ring: rgba(37, 99, 235, 0.2);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .field-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .req {
      color: #ef4444;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .row .field-group {
      flex: 1;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }
    legend {
      font-size: 14px;
      font-weight: 600;
      padding: 0 6px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      margin-bottom: 8px;
      cursor: pointer;
    }
    button[type="submit"] {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover {
      background: var(--primary-hover);
    }
    .status-toast {
      display: none;
      background: #ecfdf5;
      border: 1px solid #10b981;
      color: #065f46;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="status-toast" class="status-toast">
      Application submitted successfully!
    </div>

    <h1>Apex Autonomous</h1>
    <div class="subtitle">Senior Distributed Systems Engineer &bull; San Francisco, CA (or Remote)</div>

    <form id="application-form" onsubmit="event.preventDefault(); document.getElementById('status-toast').style.display='block';">
      <!-- Contact Information -->
      <div class="row">
        <div class="field-group">
          <label for="first_name">First Name <span class="req">*</span></label>
          <input type="text" id="first_name" name="first_name" required placeholder="e.g. Alex" />
        </div>
        <div class="field-group">
          <label for="last_name">Last Name <span class="req">*</span></label>
          <input type="text" id="last_name" name="last_name" required placeholder="e.g. Rivera" />
        </div>
      </div>

      <div class="field-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" name="email" required placeholder="alex@example.com" />
      </div>

      <div class="field-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" />
      </div>

      <!-- Links -->
      <div class="field-group">
        <label for="linkedin_url">LinkedIn Profile URL</label>
        <input type="text" id="linkedin_url" name="linkedin_url" placeholder="https://linkedin.com/in/username" />
      </div>

      <div class="field-group">
        <label for="github_url">GitHub Profile URL</label>
        <input type="text" id="github_url" name="github_url" placeholder="https://github.com/username" />
      </div>

      <!-- Work Authorization -->
      <fieldset>
        <legend>Work Authorization</legend>
        <div class="field-group">
          <label>Are you legally authorized to work in the United States? <span class="req">*</span></label>
          <label class="radio-label">
            <input type="radio" name="work_auth" value="Yes" required /> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="work_auth" value="No" /> No
          </label>
        </div>

        <div class="field-group" style="margin-bottom: 0;">
          <label>Will you now or in the future require visa sponsorship? <span class="req">*</span></label>
          <label class="radio-label">
            <input type="radio" name="sponsorship" value="Yes" required /> Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="sponsorship" value="No" /> No
          </label>
        </div>
      </fieldset>

      <!-- Intentional Skip Field -->
      <div class="field-group">
        <label for="cover_letter">Cover Letter (Optional)</label>
        <textarea id="cover_letter" name="cover_letter" rows="3" placeholder="Paste your cover letter here..."></textarea>
      </div>

      <!-- Voluntary Demographic Disclosures (Decline-to-state test) -->
      <fieldset>
        <legend>Voluntary Self-Identification</legend>
        <div class="field-group">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Select an option</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Non-Binary">Non-Binary</option>
            <option value="Decline to self-identify">I decline to self-identify</option>
          </select>
        </div>

        <div class="field-group">
          <label for="veteran_status">Veteran Status</label>
          <select id="veteran_status" name="veteran_status">
            <option value="">Select an option</option>
            <option value="I am a veteran">I am a veteran</option>
            <option value="I am not a veteran">I am not a veteran</option>
            <option value="Decline to self-identify">I decline to self-identify</option>
          </select>
        </div>
      </fieldset>

      <button type="submit" id="submit_app">Submit Application</button>
    </form>
  </div>
</body>
</html>
