<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebOS Copilot</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
    }
    .badge {
      background: #3b82f6;
      color: #fff;
      font-weight: bold;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 11px;
    }
    .title { font-size: 14px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .card strong { color: #f4f4f5; }
    .btn {
      margin-top: 12px;
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">W</div>
    <div class="title">WebOS Copilot Bridge</div>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Active Real Session</span>
  </div>
  <div class="card">
    <p><strong>Live Session Attached</strong></p>
    <p>Your current tabs, cookies, and logins (LinkedIn, Amazon, Google) are directly connected to WebOS Copilot.</p>
    <p style="margin-top: 6px; color: #10b981;">0 Isolated Profiles &bull; 0 Repeated Logins</p>
  </div>
  <button class="btn" id="openChat">Open WebOS Copilot</button>
  <script src="popup.js"></script>
</body>
</html>
