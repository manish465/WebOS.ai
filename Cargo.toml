[workspace]
members = [
    "crates/webos-types",
    "crates/webos-storage",
    "crates/webos-policy",
    "crates/webos-verifier",
    "crates/webos-browser",
    "crates/webos-model",
    "crates/webos-adapter-ext",
    "crates/webos-plugin-sdk",
    "crates/webos-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Manish <manish@webos.ai>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
